<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- 移动端视口：禁止用户缩放，确保 PWA 体验接近原生 App -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 主题色（移动端浏览器地址栏颜色） -->
  <meta name="theme-color" content="#172b3d">
  <!-- iOS PWA 支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="军费账本">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <!-- 应用标题 -->
  <title>率土军费账本</title>
  <!-- 防止 FOUC（加载时的白屏闪烁） -->
  <style>
    html, body { margin: 0; padding: 0; background: #f4f6f8; }
    #app { min-height: 100vh; }
    /* 加载动画 */
    .app-loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 16px; color: #778391; font-family: "Microsoft YaHei", sans-serif;
    }
    .app-loading .spinner {
      width: 36px; height: 36px; border: 3px solid #e4e9ee; border-top-color: #d6a64f;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Vue 应用挂载点 -->
  <div id="app">
    <div class="app-loading">
      <div class="spinner"></div>
      <span>正在加载军费账本…</span>
    </div>
  </div>
  <!-- 入口脚本（Vite 会自动注入构建后的资源） -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
