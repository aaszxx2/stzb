<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景：深蓝色圆角矩形 -->
  <rect width="512" height="512" rx="96" fill="#172b3d"/>

  <!-- 装饰：右上角金色光晕 -->
  <circle cx="420" cy="80" r="120" fill="#d6a64f" opacity="0.08"/>
  <circle cx="420" cy="80" r="70" fill="#d6a64f" opacity="0.06"/>

  <!-- 账本图标主体 -->
  <g transform="translate(128, 120)">
    <!-- 账本封面（金色） -->
    <rect x="20" y="10" width="216" height="260" rx="16" fill="#d6a64f"/>
    <!-- 书脊阴影 -->
    <rect x="20" y="10" width="28" height="260" rx="16" fill="#b8893a"/>
    <!-- 内页（白色） -->
    <rect x="52" y="24" width="176" height="232" rx="8" fill="#ffffff"/>
    <!-- 内页线条 -->
    <rect x="72" y="56" width="120" height="8" rx="4" fill="#172b3d" opacity="0.7"/>
    <rect x="72" y="84" width="100" height="6" rx="3" fill="#172b3d" opacity="0.3"/>
    <rect x="72" y="104" width="110" height="6" rx="3" fill="#172b3d" opacity="0.3"/>
    <!-- 金额数字 -->
    <text x="140" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#218567">¥</text>
    <rect x="88" y="190" width="104" height="10" rx="5" fill="#172b3d" opacity="0.15"/>
    <rect x="100" y="212" width="80" height="8" rx="4" fill="#172b3d" opacity="0.1"/>
  </g>

  <!-- 底部文字：率土军费 -->
  <text x="256" y="450" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="42" font-weight="bold" fill="#d6a64f" letter-spacing="8">军费账本</text>
</svg>
